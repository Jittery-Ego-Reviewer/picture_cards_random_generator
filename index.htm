<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>言語治療字卡</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            overscroll-behavior-y: contain; /* 防止下拉更新 */
            touch-action: pan-x pan-y; /* 允許基本滾動，但由 JS 處理滑動 */
        }
        
        #card-container {
            perspective: 1000px;
        }

        .card {
            transition: transform 0.3s ease-out, opacity 0.3s ease-out;
            will-change: transform, opacity;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .card.swiping {
            transition: none; /* 拖曳時取消動畫，讓跟隨更即時 */
        }

        .card.swiped-left {
            transform: translateX(-150%) rotate(-15deg);
            opacity: 0;
        }

        .card.swiped-right {
            transform: translateX(150%) rotate(15deg);
            opacity: 0;
        }
        
        /* 隱藏原生滾動條，保持畫面簡潔 */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
</head>
<body class="bg-gray-100 h-screen flex flex-col font-sans overflow-hidden">

    <header class="bg-white shadow-sm p-3 z-10 flex-shrink-0">
        <div class="max-w-4xl mx-auto flex items-center justify-between gap-3">
            <!-- 分類選擇器 (預設隱藏，載入圖片後顯示) -->
            <div id="category-selector-container" class="hidden flex-1 flex gap-2 items-center">
                <select id="category-selector" class="flex-1 p-2 border border-gray-300 rounded-lg text-lg focus:ring-2 focus:ring-blue-500 focus:outline-none bg-white">
                    <option value="all">所有類別</option>
                    <!-- 分類選項將透過 JS 動態加入 -->
                </select>
                <button id="shuffle-btn" class="bg-green-500 hover:bg-green-600 text-white py-2 px-4 rounded-lg text-center font-medium transition-colors flex items-center justify-center gap-1 shadow-sm shrink-0" title="重新洗牌剩餘字卡">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path></svg>
                    <span class="hidden sm:inline">洗牌</span>
                </button>
            </div>

            <!-- 右上角小巧按鈕：載入/更新圖片資料夾 -->
            <label class="cursor-pointer bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 p-2.5 rounded-lg transition-colors flex items-center justify-center gap-1.5 shrink-0 ml-auto border border-gray-200 shadow-sm" title="載入/更新圖片資料夾">
                <svg class="w-5 h-5 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 11v6m0 -6l-2 2m2-2l2 2"></path>
                </svg>
                <span id="upload-btn-text" class="text-xs font-medium hidden sm:inline text-gray-600">資料夾</span>
                <!-- 加入 webkitdirectory 允許選擇整個資料夾，以便讀取資料夾結構作為分類 -->
                <input type="file" id="image-upload" class="hidden" accept="image/*" webkitdirectory directory multiple>
            </label>
        </div>
    </header>

    <main class="flex-1 relative flex items-center justify-center p-4 overflow-hidden" id="card-container">
        
        <!-- 初始提示訊息 -->
        <div id="welcome-message" class="text-center text-gray-500 z-0">
            <svg class="w-20 h-20 mx-auto text-gray-400 mb-4 animate-pulse" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
            <p id="welcome-title" class="text-xl font-medium text-gray-600">正在檢查是否有已儲存的字卡...</p>
            <p id="welcome-desc" class="text-sm mt-2 text-gray-500">首次使用，請載入包含分類的「images」資料夾。<br>載入後系統會自動記憶，下次打開無需重新上傳！</p>
        </div>

        <!-- 卡片將會透過 JS 動態產生並放在這裡 -->
    </main>

    <footer class="bg-white p-3 shadow-[0_-2px_10px_rgba(0,0,0,0.05)] text-center text-gray-500 font-medium z-10 flex-shrink-0">
        <p id="progress-text">尚未載入字卡</p>
    </footer>

    <script>
        let allCards = [];      
        let currentCards = [];  
        let categories = new Set(); 
        let db; // 瀏覽器本地資料庫實例
        
        const uploadInput = document.getElementById('image-upload');
        const container = document.getElementById('card-container');
        const welcomeMessage = document.getElementById('welcome-message');
        const welcomeTitle = document.getElementById('welcome-title');
        const welcomeDesc = document.getElementById('welcome-desc');
        const categoryContainer = document.getElementById('category-selector-container');
        const categorySelector = document.getElementById('category-selector');
        const shuffleBtn = document.getElementById('shuffle-btn');
        const progressText = document.getElementById('progress-text');
        const uploadBtnText = document.getElementById('upload-btn-text');

        // 初始化瀏覽器資料庫 (IndexedDB)
        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open('SpeechCardsDB', 1);
                request.onerror = () => reject('資料庫開啟失敗');
                request.onsuccess = (e) => {
                    db = e.target.result;
                    resolve();
                };
                request.onupgradeneeded = (e) => {
                    db = e.target.result;
                    if (!db.objectStoreNames.contains('cards')) {
                        db.createObjectStore('cards', { keyPath: 'id' });
                    }
                };
            });
        }

        // 將圖片儲存到本地資料庫
        function saveCardsToDB(cards) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['cards'], 'readwrite');
                const store = transaction.objectStore('cards');
                store.clear(); // 儲存新資料前先清空舊資料
                cards.forEach(card => store.add(card));
                transaction.oncomplete = () => resolve();
                transaction.onerror = () => reject();
            });
        }

        // 從本地資料庫讀取圖片
        function loadCardsFromDB() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['cards'], 'readonly');
                const store = transaction.objectStore('cards');
                const request = store.getAll();
                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject();
            });
        }

        // 網頁開啟時，自動嘗試從資料庫讀取
        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                const savedCards = await loadCardsFromDB();
                if (savedCards && savedCards.length > 0) {
                    processCardsData(savedCards);
                    uploadBtnText.textContent = "更新資料夾";
                } else {
                    welcomeTitle.textContent = "請點擊右上角圖示，載入包含分類的資料夾";
                }
            } catch (error) {
                console.error("無法讀取資料庫:", error);
                welcomeTitle.textContent = "請點擊右上角圖示，載入包含分類的資料夾";
            }
        });

        uploadInput.addEventListener('change', async function(e) {
            const files = e.target.files;
            if (files.length === 0) return;

            // 顯示處理中訊息
            welcomeMessage.style.display = 'block';
            welcomeTitle.textContent = "正在處理並儲存圖片，請稍候...";
            welcomeDesc.style.display = 'none';

            let newCards = [];

            Array.from(files).forEach((file, index) => {
                const fullName = file.name.replace(/\.[^/.]+$/, "");
                let category = "未分類";
                let wordName = fullName;

                if (file.webkitRelativePath) {
                    const pathParts = file.webkitRelativePath.split('/');
                    if (pathParts.length > 1) {
                        const folderName = pathParts[pathParts.length - 2];
                        if (folderName.toLowerCase() !== 'images' && folderName !== '') {
                            category = folderName;
                        }
                    }
                }

                if (category === "未分類" && fullName.includes('-')) {
                    const parts = fullName.split('-');
                    category = parts[0].trim();
                    wordName = parts.slice(1).join('-').trim();
                }

                // 將真實的檔案 (Blob) 存起來，而不是暫時的網址
                newCards.push({
                    id: index,
                    name: wordName,
                    category: category,
                    blob: file 
                });
            });

            try {
                await saveCardsToDB(newCards); // 存入資料庫
                processCardsData(newCards);    // 更新畫面
                uploadBtnText.textContent = "更新資料夾";
            } catch (err) {
                alert("儲存失敗，可能是圖片總容量超過瀏覽器限制。");
                welcomeTitle.textContent = "儲存失敗，請重試或減少圖片數量";
            }
        });

        // 整理讀取到的卡片資料並設定下拉選單
        function processCardsData(cardsData) {
            allCards = cardsData;
            categories.clear();
            categorySelector.innerHTML = '<option value="all">所有類別</option>';

            allCards.forEach(card => {
                categories.add(card.category);
            });

            if (categories.size > 0) {
                categoryContainer.classList.remove('hidden');
                categoryContainer.classList.add('flex');
                Array.from(categories).sort().forEach(cat => {
                    const option = document.createElement('option');
                    option.value = cat;
                    option.textContent = cat;
                    categorySelector.appendChild(option);
                });
            }

            welcomeMessage.style.display = 'none';
            loadCategory('all');
        }

        categorySelector.addEventListener('change', (e) => {
            loadCategory(e.target.value);
        });

        shuffleBtn.addEventListener('click', () => {
            if (currentCards.length > 1) {
                const existingCards = container.querySelectorAll('.card');
                existingCards.forEach(c => {
                    // 清理不再顯示的卡片產生的臨時網址
                    if(c.dataset.blobUrl) URL.revokeObjectURL(c.dataset.blobUrl);
                    c.remove();
                });
                
                shuffleArray(currentCards);
                renderTopCard();
                
                const originalBg = shuffleBtn.className;
                shuffleBtn.classList.replace('bg-green-500', 'bg-green-700');
                setTimeout(() => {
                    shuffleBtn.classList.replace('bg-green-700', 'bg-green-500');
                }, 150);
            }
        });

        function loadCategory(category) {
            const existingCards = container.querySelectorAll('.card');
            existingCards.forEach(c => {
                if(c.dataset.blobUrl) URL.revokeObjectURL(c.dataset.blobUrl);
                c.remove();
            });

            if (category === 'all') {
                currentCards = [...allCards];
            } else {
                currentCards = allCards.filter(card => card.category === category);
            }
            
            shuffleArray(currentCards);
            updateProgress();
            
            if (currentCards.length > 0) {
                renderTopCard();
            } else {
                welcomeMessage.style.display = 'block';
                welcomeTitle.textContent = "此類別沒有字卡了";
                welcomeDesc.style.display = 'none';
            }
        }

        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        function renderTopCard() {
            if (currentCards.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500"><p class="text-2xl font-bold mb-4">🎉 完成了！</p><button onclick="loadCategory(document.getElementById(\'category-selector\').value)" class="bg-blue-500 text-white px-6 py-2 rounded-lg">重新開始</button></div>';
                return;
            }

            const cardData = currentCards[currentCards.length - 1]; 
            
            // 每次要顯示卡片時，才為資料庫裡的檔案產生臨時網址 (節省記憶體)
            const tempUrl = URL.createObjectURL(cardData.blob);

            const cardEl = document.createElement('div');
            cardEl.className = 'card absolute bg-white rounded-3xl overflow-hidden flex flex-col cursor-grab select-none';
            cardEl.style.width = 'min(90vw, 500px)';
            cardEl.style.height = 'min(75vh, 700px)';
            cardEl.style.maxWidth = '100%';
            cardEl.style.maxHeight = '100%';
            cardEl.style.zIndex = 10;
            cardEl.dataset.blobUrl = tempUrl; // 記錄網址以便後續清理

            cardEl.innerHTML = `
                <div class="flex-1 bg-gray-50 p-4 flex items-center justify-center relative overflow-hidden">
                    <img src="${tempUrl}" alt="${cardData.name}" class="max-w-full max-h-full object-contain pointer-events-none" draggable="false">
                </div>
                <div class="bg-white p-6 sm:p-8 flex items-center justify-center border-t-4 border-blue-100 flex-shrink-0">
                    <h2 class="text-4xl sm:text-6xl font-black text-gray-800 tracking-wider">${cardData.name}</h2>
                </div>
            `;

            container.appendChild(cardEl);
            setupSwipeEvent(cardEl);
            updateProgress();
        }

        function setupSwipeEvent(card) {
            let startX = 0;
            let currentX = 0;
            let isDragging = false;
            const threshold = window.innerWidth * 0.25; 

            function onDragStart(clientX) {
                isDragging = true;
                startX = clientX;
                card.classList.add('swiping');
                card.style.cursor = 'grabbing';
            }

            function onDragMove(clientX) {
                if (!isDragging) return;
                currentX = clientX - startX;
                const rotate = currentX * 0.05; 
                card.style.transform = `translateX(${currentX}px) rotate(${rotate}deg)`;
            }

            function onDragEnd() {
                if (!isDragging) return;
                isDragging = false;
                card.classList.remove('swiping');
                card.style.cursor = 'grab';

                if (Math.abs(currentX) > threshold) {
                    if (currentX > 0) {
                        card.classList.add('swiped-right');
                    } else {
                        card.classList.add('swiped-left');
                    }
                    
                    setTimeout(() => {
                        // 清理圖片網址記憶體並移除節點
                        URL.revokeObjectURL(card.dataset.blobUrl); 
                        card.remove();
                        currentCards.pop(); 
                        renderTopCard();
                    }, 300); 
                } else {
                    card.style.transform = '';
                }
                currentX = 0;
            }

            card.addEventListener('touchstart', (e) => onDragStart(e.touches[0].clientX), {passive: true});
            card.addEventListener('touchmove', (e) => onDragMove(e.touches[0].clientX), {passive: true});
            card.addEventListener('touchend', onDragEnd);
            card.addEventListener('touchcancel', onDragEnd);

            card.addEventListener('mousedown', (e) => onDragStart(e.clientX));
            window.addEventListener('mousemove', (e) => onDragMove(e.clientX)); 
            window.addEventListener('mouseup', onDragEnd);
        }

        function updateProgress() {
            if (allCards.length === 0) {
                progressText.textContent = '尚未載入字卡';
                return;
            }
            const total = categorySelector.value === 'all' ? allCards.length : allCards.filter(c => c.category === categorySelector.value).length;
            const remaining = currentCards.length;
            progressText.textContent = `剩餘字卡: ${remaining} / ${total}`;
        }
    </script>
</body>
</html>
